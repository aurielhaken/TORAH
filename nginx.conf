# Configuration Nginx pour Torah AI
# Copiez ce fichier dans /etc/nginx/sites-available/torah-ai

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Logs
    access_log /var/log/nginx/torah-ai-access.log;
    error_log /var/log/nginx/torah-ai-error.log;

    # Taille maximale des uploads
    client_max_body_size 10M;

    # Proxy vers l'application FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (si besoin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache des fichiers statiques (si vous en avez)
    location /static/ {
        alias /home/votre_utilisateur/TORAH/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité : cache la version du serveur
    server_tokens off;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

